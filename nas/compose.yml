name: cardea

services:
  cardea:
    image: yuzuholic/cardea:latest
    restart: unless-stopped
    stop_grace_period: 2m

    environment:
      # langfuse
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://truenas.local:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      SALT: ${SALT:?set SALT in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      AUTH_DISABLE_SIGNUP: ${AUTH_DISABLE_SIGNUP:-false}

      # langfuse storage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      REDIS_AUTH: ${REDIS_AUTH:?set REDIS_AUTH in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}

      # hindsight
      HINDSIGHT_DB_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD in .env}
      HINDSIGHT_MCP_TOKEN: ${HINDSIGHT_MCP_TOKEN:?set HINDSIGHT_MCP_TOKEN in .env}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?set CLAUDE_CODE_OAUTH_TOKEN in .env}

      # optional: the cloudflare tunnel only starts when a token is set.
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

      # optional: the model hindsight extracts facts with.
      HINDSIGHT_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-claude-haiku-4-5}

      # optional: a deepseek api key; hindsight fails over to deepseek when claude fails.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

      # optional: turns on hindsight's traces to langfuse.
      HINDSIGHT_LANGFUSE_AUTH: ${HINDSIGHT_LANGFUSE_AUTH:-}

    volumes:
      # the launcher drives the host's docker engine; this is root on the NAS.
      - /var/run/docker.sock:/var/run/docker.sock
